[project]
name = "claimcheck"
version = "0.1.0"
description = "Claim Checker: retrieval-augmented fact checking against the Pakistan Economic Survey."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
    "tokenizers>=0.20",
    "torch>=2.4",
    "sentence-transformers>=3.2",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.5",
    "openai>=1.50",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-ulid>=3.0",
    "huggingface_hub>=0.25",
]

[project.scripts]
claimcheck = "claimcheck.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claimcheck"]

# CPU-only torch on Linux (CI, Docker). macOS wheels on PyPI are already CPU/MPS.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not corpus and not live'"
markers = [
    "corpus: needs the local corpus under data/ (corpus tests)",
    "live: spends LLM quota; run only on purpose",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
